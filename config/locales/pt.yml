    body4: "Clique com o botão direito para enviar para a Lixeira. Use o Coletor para agrupar itens de pastas diferentes."
    title5: "Histórico instantâneo"
    body5: "Reabra qualquer um dos últimos 3 escaneamentos instantaneamente. Um painel mostra tudo que você liberou."
    title6: "9 idiomas"
    body6: "Inglês, Francês, Alemão, Espanhol, Italiano, Português, Holandês, Polonês, Japonês."
