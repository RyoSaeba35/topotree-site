    title1: "Escaneia em segundos"
    body1: "Lê a tabela de arquivos NTFS diretamente. Um disco completo com 750.000 arquivos em menos de 5 segundos."
    title2: "Duas visualizações, mesmos dados"
    body2: "Alterne entre um mapa de árvore e um sunburst. Ambos atualizam em tempo real."
    title3: "Encontre arquivos esquecidos"
    body3: "Filtre por idade para mostrar apenas arquivos não modificados há 1, 2 ou 5+ anos."
