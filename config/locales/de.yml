  features:
    title1: "Scannt in Sekunden"
    body1: "Liest die NTFS-Master-Dateitabelle direkt. Eine volle Festplatte mit 750.000 Dateien in unter 5 Sekunden."
    title2: "Zwei Ansichten, gleiche Daten"
    body2: "Wechseln Sie zwischen einer Treemap und einem Sunburst. Beide aktualisieren sich live während Sie navigieren."
    title3: "Vergessene Dateien finden"
    body3: "Filtern Sie nach Alter, um nur Dateien anzuzeigen, die seit 1, 2 oder 5+ Jahren nicht berührt wurden."
    title4: "Sicher aufräumen"
    body4: "Rechtsklick zum Verschieben in den Papierkorb. Verwenden Sie den Kollektor-Korb, um Elemente aus verschiedenen Ordnern zu sammeln."
    title5: "Sofortige Historie"
    body5: "Öffnen Sie jeden der letzten 3 Scans sofort ohne erneutes Scannen. Ein Dashboard zeigt alles, was Sie freigegeben haben."
    title6: "9 Sprachen"
    body6: "Englisch, Französisch, Deutsch, Spanisch, Italienisch, Portugiesisch, Niederländisch, Polnisch, Japanisch."
  screenshots:
